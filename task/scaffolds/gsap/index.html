<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ball bounce</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #stage { position: relative; width: 960px; height: 540px; overflow: hidden; background: #eef2f7; }
    #floor { position: absolute; left: 0; top: 460px; width: 100%; height: 2px; background: #333; }
    #ball {
      position: absolute;
      width: 48px;
      height: 48px;
      margin-left: -24px;
      margin-top: -24px;
      border-radius: 50%;
      background: #555;
      left: 0;
      top: 0;
      transform: translate(80px, 140px);
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="floor"></div>
    <div id="ball"></div>
  </div>
  <!-- Pinned CDN build -- keep this exact tag. GSAP is then available as
       the global `gsap`. Do not replace this with a bundled/ESM import:
       the grading tooling only recognizes tweens made through this
       global. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="animation.js"></script>
</body>
</html>
