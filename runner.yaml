# Runner config: WHO runs the grid and WHICH SLICE of it. Kept separate
# from task/task.yaml so the task itself stays model-agnostic.

# provider: "anthropic" (direct Anthropic API, model IDs like
# "claude-opus-5") or "openrouter" (OpenAI-compatible endpoint covering
# every non-Anthropic family -- GPT, Gemini, Llama, etc. -- model IDs
# like "openai/gpt-5", "google/gemini-3-pro"; needs OPENROUTER_API_KEY in
# .env). thinking/output_config below are Anthropic-specific and are
# ignored (with a warning) under openrouter. See runtime/providers/ for
# how a request/response gets translated either way.
worker:
  # provider: anthropic
  # models:
  #   - claude-opus-5
  provider: openrouter
  models:
    - openai/gpt-5

  # thinking/output_config are Anthropic-specific -- ignored (with a
  # warning) under openrouter, so commented out rather than left to warn
  # on every run. Restore these if provider is switched back to anthropic.
  # thinking:
  #   type: adaptive
  # output_config:
  #   effort: high

  # Per-API-call ceiling (separate from task.yaml's max_output_tokens,
  # a cumulative budget checked after each turn). With adaptive thinking
  # and effort=high, a single turn's thinking alone can exceed several
  # thousand tokens before any actual response -- 8192 was observed
  # truncating turn 2 mid-thinking (stop_reason=max_tokens) on
  # 2026-11-19, ending the rollout with nothing written, since
  # runtime/agent.py treats any non-tool_use stop_reason as terminal.
  max_tokens: 32000

# Which slice of task.yaml's frameworks/materials/feedback_modes to run,
# and how many repeats (seeds) per cell. Must be subsets of task.yaml.
grid:
  frameworks: [css]
  materials: [rubber_ball]
  feedback_modes: [full_feedback]
  seeds: 1

batch:
  concurrency: 1

output_dir: ./runs
