# Runner config: WHO runs the grid and WHICH SLICE of it. Kept separate
# from task/task.yaml so the task itself stays model-agnostic.

worker:
  provider: anthropic
  models:
    - claude-sonnet-5

  # Sonnet 5 removed the fixed thinking budget: {type: enabled, budget_tokens: N}
  # returns a 400. Adaptive is the only on-mode -- Claude decides how much to
  # think per turn. Depth would be tuned with output_config.effort (default
  # "high"), which runtime/agent.py does not pass through yet.
  thinking:
    type: adaptive

  # Pinned rather than left to the API default (currently "high"). Effort
  # changes how hard the worker thinks, so it is an experimental variable:
  # leaving it implicit would let a future default change silently shift
  # scores. Each run freezes this file, so every record states its effort.
  # Levels: low | medium | high | xhigh | max.
  output_config:
    effort: high

  max_tokens: 8192

# Which slice of task.yaml's frameworks/materials/feedback_modes to run,
# and how many repeats (seeds) per cell. Must be subsets of task.yaml.
grid:
  frameworks: [css]
  materials: [bowling_ball]
  feedback_modes: [blind]
  seeds: 1

batch:
  concurrency: 1

output_dir: ./runs
