# Runner config: WHO runs the grid and WHICH SLICE of it. Kept separate
# from task/task.yaml so the task itself stays model-agnostic.

# provider: "anthropic" (direct Anthropic API, model IDs like
# "claude-opus-5") or "openrouter" (OpenAI-compatible endpoint covering
# every non-Anthropic family -- GPT, Gemini, Llama, etc. -- model IDs
# like "openai/gpt-5", "google/gemini-3-pro"; needs OPENROUTER_API_KEY in
# .env). thinking/output_config below are Anthropic-specific and are
# ignored (with a warning) under openrouter. See runtime/providers/ for
# how a request/response gets translated either way.
worker:
  # provider: anthropic
  # models:
  #   - claude-opus-5
  provider: openrouter
  models:
    - anthropic/claude-opus-5.5
    - openai/gpt-6-sol
    - openai/gpt-6-luna
    - google/gemini-4-hydrogen

  # No temperature is set, deliberately. OpenRouter's model metadata lists
  # `temperature` as unsupported on every one of the models above except
  # gemini-4-hydrogen (they're reasoning models), so pinning it would apply
  # to one cell of the grid and be dropped or rejected on the rest --
  # worse than leaving it unset, since it would read as a controlled
  # variable without being one. Across-seed spread therefore comes from
  # each model's own default sampling, which is also what makes repeated
  # seeds informative rather than redundant.

  # thinking/output_config are Anthropic-specific -- ignored (with a
  # warning) under openrouter, so commented out rather than left to warn
  # on every run. Restore these if provider is switched back to anthropic.
  # thinking:
  #   type: adaptive
  # output_config:
  #   effort: high

  # Per-API-call ceiling (separate from task.yaml's max_output_tokens,
  # a cumulative budget checked after each turn). With adaptive thinking
  # and effort=high, a single turn's thinking alone can exceed several
  # thousand tokens before any actual response -- 8192 was observed
  # truncating turn 2 mid-thinking (stop_reason=max_tokens) on
  # 2026-11-19, ending the rollout with nothing written, since
  # runtime/agent.py treats any non-tool_use stop_reason as terminal.
  max_tokens: 32000

# Which slice of task.yaml's frameworks/materials/feedback_modes to run,
# and how many repeats (seeds) per cell. Must be subsets of task.yaml.
grid:
  frameworks: [css]
  materials: [rubber_ball]
  feedback_modes: [full_feedback]
  # 5, not 1-3: analysis/aggregate.py reports paired-bootstrap CIs over
  # seeds, and resampling fewer than ~5 points per cell produces an
  # interval that mostly reflects the resampling, not the model. Held at
  # the low end of useful because every extra seed multiplies across the
  # model list.
  seeds: 5

batch:
  # Each rollout holds its own container (capped at --memory 2g in
  # runtime/sandbox.py) and Docker's VM here has 7.75GB total. The cap is
  # a ceiling rather than a reservation and these containers idle at a few
  # tens of MB, so 4 in flight is comfortable; it also spreads the API
  # load across all four providers instead of serializing on one.
  concurrency: 4

output_dir: ./runs
