<!doctype html>
<html>
<head>
<style>#ball { position: absolute; width: 48px; height: 48px; transform: translate(80px, 140px); }</style>
</head>
<body>
<div id="ball"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
gsap.set("#ball", { x: 80, y: 140 });
var tl = gsap.timeline();
tl.to("#ball", { x: 480, y: 320, duration: 1, ease: "power2.in" });
tl.to("#ball", { x: 880, y: 140, duration: 1, ease: "power2.out" });
</script>
</body>
</html>
